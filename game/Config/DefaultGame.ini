; Required by the GameFeatures plugin, which arrives as a transitive dependency of
; AllToolsets (AllToolsets -> GameFeaturesToolset -> GameFeatures). Without a scan rule
; for GameFeatureData the cook commandlet ends in "Failure - 2 error(s)" and packaging
; fails with Error_UnknownCookFailure, even though the cook itself completes.
; This project ships no game feature plugins, so the rule points at an unused path.
; Added 2026-08-25 for G02.
